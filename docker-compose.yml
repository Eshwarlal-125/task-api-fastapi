version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: task-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: